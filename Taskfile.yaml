version: '3'

tasks:
  run:
    desc: Run application
    cmds:
      - go run .

  build:
    desc: Build application
    cmds:
      - go build -o bin/app .

  test:
    desc: Run tests
    cmds:
      - go test ./...

  fmt:
    desc: Format code
    cmds:
      - gofmt -w .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/

  lint:
    desc: lint code with prek
    cmds:
      - prek run -v --all-files 